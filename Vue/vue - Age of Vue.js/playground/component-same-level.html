<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <app-header v-bind:testnumb="num"></app-header>
        <app-content v-on:pass="test"></app-content>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

    <script>
        var appHeader = {
            template : '<div>header {{ testnumb }}</div>',
            props : ['testnumb']
        }
        var appContent = {
            template : '<div>content <button v-on:click="passNum">pass</button></div>',
            methods : {
                passNum: function(){
                     this.$emit('pass',10,11);
                }
            }
        }
        new Vue({
            el: '#app',
            components : {
                'app-header' : appHeader,
                'app-content' : appContent
            },
            data: {
                num : 0
            },
            methods : {
                test : function(a,b){
                    this.num = a;
                    console.log(this.num);
                }
            }
        })
    </script>
</body>
</html>
