<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <app-content v-bind:content_num="numb" v-on:add="addNumb"></app-content>
        <app-result v-bind:result_num="numb"></app-result>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

    <script>
        var appContent = {
            template : '<button v-on:click="addNumb">버튼 {{ content_num }}</button>',
            // data: {
            //     num : 10
            // },
            props : ['content_num'],
            methods :{
                addNumb : function(){
                    // console.log(this.contentNum);
                    this.$emit('add');
                }
            },
            
            
        }

        var appResult = {
            template : '<div>숫자 {{ result_num }}</div>',
            props : ['result_num'],
        }
        new Vue({
            el : '#app',
            components : {
                'app-content' : appContent,
                'app-result' : appResult
            },
            data : {
                numb : 10
            },
            methods : {
                addNumb : function(){
                    this.numb++;
                    console.log(this.numb);
                }
            }
        })
    </script>
</body>
</html>
