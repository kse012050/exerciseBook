<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.7 원의 색상(밝기) 와 팡팡 터지는 효과 넣었다</title>
    <style>
        body{margin: 0; line-height: 0;}
        canvas{background-color: #222; }
    </style>
</head>
<body>
    <script>
        let ctx, canvas , w , h , balls = [];
        let rgb = [
            "rgb(26,188,156)",
            "rgb(46,204,113)",
            "rgb(52,152,219)",
            "rgb(155,89,182)",
            "rgb(241,196,15)",
            "rgb(230,126,34)",
            "rgb(231,76,60)",
        ]

        canvas = document.createElement('canvas');
        document.body.append(canvas);
        ctx = canvas.getContext('2d');
        function init(){
            canvasSize();
            for(var a = 0; a < 1; a++){
                balls.push(new Ball());
            }
            animationLoop();

        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function randomValue(min , max){
            return (Math.random() * (max - min)) + min;
        }

        function drawBalls(){
            balls.map((a)=>{
                a.update();
                a.draw();
            })
        }

        function animationLoop(){
            ctx.clearRect(0 , 0 , w , h);
            drawBalls();
            requestAnimationFrame(animationLoop);
        }

        function easeOutQuart(x){
            return 1 - Math.pow(1 - x, 4);
        }

        class Ball{
            constructor(){
                this.x = w / 2;
                this.y = h / 2;
                this.size = randomValue(30 , 40);
                this.time = 0;
                this.ttl = 120;

                // this.posX = Math.sin((Math.PI / 180) * randomValue(0 , 360)) * 10;
                // this.posY = Math.cos((Math.PI / 180) * randomValue(0 , 360)) * 10;

                this.start = {
                    x : w / 2 + randomValue(-20, 20),
                    y : h / 2 + randomValue(-20, 20),
                    size : randomValue(30,40)
                }

                this.end = {
                    x : this.start.x + randomValue(-300,300),
                    y : this.start.y + randomValue(-300,300)
                }

                this.x = this.start.x;
                this.y = this.start.y;
0
            }

            draw(){
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.size,0,Math.PI *2);
                ctx.closePath();
                ctx.fill(); 
            }

            update(){
                if(this.time <= this.ttl){
                    let progress = 1 - (this.ttl - this.time) / this.ttl;

                    this.size = this.start.size * ( 1 - easeOutQuart(progress))
                    // this.x = this.x + this.posX;
                    // this.y = this.y + this.posY;
                    this.x = this.x + (this.end.x - this.x) * 0.01;
                    this.y = this.y + (this.end.y - this.y) * 0.01;
                    // this.size >= 0.7 ? this.size -= 0.7 : this.size = 0;
                    console.log(1);
                }
                this.time++;
            }
        }
        // window.onload = function(){
        //     init();
        // }
        window.addEventListener('DOMContentLoaded',init)
    </script>
</body>
</html>
