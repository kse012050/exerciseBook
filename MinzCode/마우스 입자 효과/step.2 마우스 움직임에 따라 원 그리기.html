<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.2 마우스 움직임에 따라 원 그리기</title>
    <style>
        body{margin: 0; line-height: 0;}
        #canvas{background-color: #222;}
        div{position: fixed; left: 10px; top: 10px; color: lightgreen; line-height: 1;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let w , h , canvas , ctx , balls = [] , mouse = { x : undefined, y : undefined};
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            canvasReset();
            animationLoop();
        }

        function canvasReset(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function mousemove(e){
            mouse.x = e.x;
            mouse.y = e.y;

            balls.push(new Ball(mouse));
            document.querySelector('div span').innerHTML = balls.length;
        }

        function mouseout(){

        }

        function ballsDraw(){
            balls.map((b)=>{
                b.draw();
            })
        }

        function animationLoop(){
            ballsDraw();
            requestAnimationFrame(animationLoop);
        }

        class Ball{
            constructor(mouse){
                this.mouseX = mouse.x;
                this.mouseY = mouse.y;
            }

            draw(){
                ctx.beginPath();
                ctx.fillStyle = 'white';
                ctx.arc(this.mouseX, this.mouseY, 25 , 0 , Math.PI * 2);
                ctx.fill();
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize',canvasReset);
        window.addEventListener('mousemove',mousemove);
        window.addEventListener('mouseout',mouseout);
    </script>
    <div>balls length = <span></span></div>
</body>
</html>
