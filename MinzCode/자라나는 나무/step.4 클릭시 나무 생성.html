<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.4 클릭시 나무 생성</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background-color: #ccc;}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let canvas , ctx , w, h , trees;

        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            canvasSize();
            drawGround();
            trees = new Tree();
            animationLoop();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function drawGround(){
            ctx.beginPath();
            ctx.rect(0 , h - 10, w , h);
            ctx.fillStyle = 'black';
            ctx.fill();
        }

        function animationLoop(){
            drawScene();

            requestAnimationFrame(animationLoop)
        }

        function drawScene(){
            trees.draw();
            trees.update();
        }

        function randomValue(min , max){
            return Math.floor((Math.random() * ( max - min)) + min);
        }

        class Tree{
            constructor(){
                this.x = w / 2;
                this.y = h - 10;
                this.size = randomValue(5 , 7);
                this.angle = 180;
                this.branch = [];
                console.log(this.size);
                this.branch.push(new Branch(this.x , this.y ,this.size , this.angle));
                // this.addBranch();
            }

            addBranch(){
                // this.branch.push(new Branch());
            }
            
            draw(){
                this.branch.map((b)=>{
                    b.draw();
                })
            }

            update(){
                this.branch.map((b)=>{
                    b.update();
                })
            }
        }

        class Branch{
            constructor(x , y , size , angle){
                this.x = x;
                this.y = y;
                this.size = size;
                this.angle = angle;
                this.length = this.size * 20;
                this.progress = 0;
                this.branchReset();
            }

            branchReset(){
                this.sx = this.x;
                this.sy = this.y;
            }

            draw(){
                ctx.beginPath();
                ctx.arc(this.x , this.y , this.size, 0 ,Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();
            }

            update(){
                let radian = (Math.PI / 180) * this.angle;
                this.x = this.sx + (this.progress * this.length * Math.sin(radian));
                this.y = this.sy + (this.progress * this.length * Math.cos(radian));
                this.progress = this.progress + 0.1 / this.size;
                if(this.progress > 1){
                    this.progress = 0;
                    this.branchReset();
                }
                // console.log(this.progress);
            }
        }
        
        window.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
