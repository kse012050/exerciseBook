<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.4 클릭시 나무 생성</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background-color: #ccc;}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        let canvas , ctx , w , h , trees = [];
        
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            canvasSize();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;

            drawRound();
            trees.push(new Tree)
            animationLoop();
        }

        function drawRound(){
            ctx.beginPath();
            ctx.fillRect(0 , h - 10 , w , h);
            ctx.fillStyle = "black";
            ctx.fill();
        }

        function animationLoop(){
            
            drawScene()
            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            trees.map((t)=>{
                t.draw();
                t.update();
            })
        }

        class Tree{
            constructor(){
                this.x = w / 2;
                this.y = h;
                this.radian = 180;
                this.speed = 1.2;
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x , this.y , 5, 0 , Math.PI * 2);
                ctx.fillStyle = 'red'
                ctx.fill();
            }
            update(){
                this.x =this.x + Math.sin(Math.PI / 180 * this.radian) * this.speed;
                this.y =this.y + Math.cos(Math.PI / 180 * this.radian) * this.speed;
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize' , canvasSize);
    </script>
</body>
</html>
