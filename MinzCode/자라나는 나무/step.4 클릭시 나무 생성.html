<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.4 클릭시 나무 생성</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background-color: #ccc;}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        let canvas , ctx , w , h , trees = [];
        
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            canvasSize();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;

            drawRound();
            trees.push(new Tree)
            animationLoop();
        }

        function drawRound(){
            ctx.beginPath();
            ctx.fillRect(0 , h - 10 , w , h);
            ctx.fillStyle = "black";
            ctx.fill();
        }

        function animationLoop(){
            
            drawScene()
            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            trees.map((t)=>{
                t.draw();
                t.update();
            })
        }

        function randomValue(min , max){
            return Math.round((Math.random() * (max - min)) + min);
        }

        class Tree{
            constructor(){
                this.x = w / 2;
                this.y = h;
                this.size = 5;
                this.angle = 180;
                this.branchs = [new Branch(this.x , this.y , this.size , this.angle)];
            }
            draw(){
                this.branchs.map((b)=>{
                    b.draw();
                })
            }
            update(){
                this.branchs.map((b)=>{
                    b.update();

                    if(b.size > 0 && b.progress >= 30 && b.branchCount < 3 && Math.random() < 0.3){
                        this.branchs.push(new Branch(b.x , b.y, b.size - 1 , b.angle + randomValue(-30 , 30)))
                        b.branchCount++;
                    }
                })
            }
        }

        class Branch{
            constructor(x , y , size , angle){
                this.x = x;
                this.y = y;
                this.size = size;
                this.angle = angle;
                this.speed = 1.2;
                this.progress = 0;
                this.branchCount = 0;
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x , this.y , this.size, 0 , Math.PI * 2);
                ctx.fillStyle = `rgba(0,0,0,0.5)`;
                ctx.fill();
            }

            update(){
                if(this.progress <= 60){
                    this.x = this.x + Math.sin(Math.PI / 180 * this.angle);
                    this.y = this.y + Math.cos(Math.PI / 180 * this.angle) * this.speed;
                    this.progress++;
                }else if(this.size > 0){
                    this.angle = this.angle + randomValue(-10 , 10);
                    this.size--;
                    this.progress = 0;
                }
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize' , canvasSize);
    </script>
</body>
</html>
