<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.4 클릭시 나무 생성</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background-color: #ccc;}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let canvas , ctx , w , h , tree;
        let branchChance = [0.08, 0.09, 0.10, 0.11, 0.12, 0.15, 0.3];
        let branchAngles = [20, 25, 30, 35];
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            canvasSize();
            tree = new Tree();
            animationLoop();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;

            drawGround();
        }

        function drawGround(){
            ctx.beginPath();
            ctx.rect(0 , h - 10, w,h);
            ctx.fillStyle = 'black';
            ctx.fill()
        }

        function animationLoop(){
            drawScene();
            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            tree.draw();
            tree.update();
        }

        function randomValue(min , max){
            return Math.floor((Math.random() * (max - min)) + min);
        }

        class Tree{
            constructor(){
                this.x = w / 2;
                this.y = h - 10;
                this.size = randomValue(5 , 7);
                this.angle = 180;
                this.branch = [];
                this.branch.push(new Branch(this.x , this.y , this.size , this.angle))
            }

            draw(){
                this.branch.map((b)=>{
                    b.draw();
                })
            }
            
            update(){
                this.branch.map((b)=>{
                    b.update();

                    if(b.size > 0 && b.progress > 0.4 && Math.random() < b.branchChance && b.branchCount < 3){
                        this.branch.push(new Branch(b.x , b.y , b.size - 1, b.angle + branchAngles[Math.floor(Math.random() * branchAngles.length)] * b.branchDirection))
                        b.branchCount++;
                        b.branchDirection *= -1;
                        console.log(branchChance[7 - b.size]);
                    }
                })
            }
        }

        class Branch{
            constructor(x , y , size , angle){
                this.x = x;
                this.y = y;
                this.size = size;
                this.angle = angle;
                this.branchCount = 0;
                this.branchReset();
            }
            
            branchReset(){
                this.sx = this.x;
                this.sy = this.y;
                this.length = this.size * 20;
                this.progress = 0;
                this.branchChance = branchChance[7 - this.size];
                this.branchDirection = (Math.random() < 0.5 ? 1 : -1);
            }

            draw(){
                if(this.size <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x , this.y , this.size , 0 , Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fill();
            }

            update(){
                let radian = (Math.PI / 180) * this.angle;
                this.x = this.sx + (this.progress * this.length * Math.sin(radian));
                this.y = this.sy + (this.progress * this.length * Math.cos(radian));

                this.progress += 0.1 / this.size;

                if(this.progress > 1){
                    this.size -= 1;
                    this.angle += randomValue(-10 , 10);
                    // this.angle += (Math.floor(Math.random() * 3) - 1) * 10;
                    this.branchReset();
                }
            }
        }

        window.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
