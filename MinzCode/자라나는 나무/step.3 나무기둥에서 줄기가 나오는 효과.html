<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.3 나무기둥에서 줄기가 나오는 효과</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background-color: #ccc;}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        let canvas , ctx , w , h , trees = [];
        let branchAngles = [20,25,30,35];

        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            canvasSize();
            drawGround();

            trees.push(new Tree());

            animationLoop();
        }

        function drawGround(){
            ctx.fillRect(0, h - 10, w, h);
            ctx.fill();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function animationLoop(){
            drawScene();

            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            trees.map((t)=>{
                t.draw();
                t.update();
            })
        }

        class Tree{
            constructor(){
                this.x = w / 2;
                this.y = h;
                this.size = 5;
                this.angle = 180;
                this.branchs = [];
                this.addBranch(this.x , this.y , this.size , this.angle)
            }

            addBranch(x , y , size ,  angle){
                this.branchs.push(new Branch(x , y , size ,angle));
            }

            draw(){
                this.branchs.map((b)=>{
                    b.draw();
                })
            }

            update(){
                this.branchs.map((b)=>{
                    b.update();

                    if(b.size > 0 && b.progress > 0.4 && Math.random() < 0.5 && b.branchCount < 3){
                        this.addBranch(b.x , b.y , b.size - 1, b.angle + branchAngles[Math.floor(Math.random() * branchAngles.length)] * b.branchDirection);
                        b.branchCount++;
                        b.branchDirection *= -1;
                    }
                })
            }
        }

        class Branch{
            constructor(x, y, size , angle){
                this.x = x;
                this.y = y;
                this.size = size;
                this.angle = angle;
                this.branchReset();
            }

            branchReset(){
                this.sx = this.x;
                this.sy = this.y;
                this.progress = 0;
                this.branchCount = 0;
                this.branchDirection = (Math.random() < 0.5) ? -1 : 1;
            }

            draw(){
                if(this.progress > 1 || this.size <= 0) return
                ctx.beginPath();
                ctx.fillStyle = `rgba(0,0,0,1)`
                ctx.arc(this.x , this.y, this.size , 0 , Math.PI * 2);
                ctx.fill()
            }

            update(){
                let radian = (Math.PI / 180) * this.angle;
                this.x = this.sx + (this.size * 20 * this.progress) * Math.sin(radian);
                this.y = this.sy + (this.size * 20 * this.progress) * Math.cos(radian);
                this.progress += .1 / this.size;

                if(this.progress > 1){
                    this.size -= 1;
                    this.angle += (Math.floor(Math.random() * 3) - 1) * 10;
                    this.branchReset();
                }
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize', canvasSize);
    </script>
</body>
</html>
