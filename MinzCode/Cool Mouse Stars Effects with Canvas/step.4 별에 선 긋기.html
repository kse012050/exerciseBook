<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.4 별에 선 긋기</title>
    <style>
        *{margin: 0; padding: 0; line-height: 0;}
        canvas{background-color: black; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        
        let convas , ctx, w , h , particles = [];
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            canvasSize();
            animationLoop();
        }
        
        function canvasSize(){
            canvas.width = w = window.innerWidth;
            canvas.height = h = window.innerHeight;
        }

        function canvasResize(){
            canvasSize();
        }

        function animationLoop(){
            drawScene();
        }

        function drawScene(){
            particles.push(new Particle());
            particles.map((particle) => {
                particle.setPoint();
                particle.draw();
            })
        }

        class Particle{
            constructor(){
                this.w = w / 2;
                this.h = h / 2;
                this.point = [];
            }

            setPoint(){
                let r, x, y;
                for(let a = 0; a < 360; a+=36){
                    let d = ((a / 36) % 2 === 0) ? 25 : 50;
                    r = (Math.PI / 180) * a;
                    x = this.w + d * Math.sin(r);
                    y = this.h + d * Math.cos(r);
                    this.point.push({
                        x : x,
                        y : y,
                    });
                }
            }

            draw(){
                this.point.map((p)=>{
                    ctx.beginPath();
                    ctx.fillStyle = 'red';
                    ctx.arc(p.x , p.y , 1 , 0 , Math.PI * 2);
                    ctx.fill();
                });

                ctx.beginPath();
                for(let a = 0; a < this.point.length; a++){
                    ctx.strokeStyle = 'blue';
                    if(a === 0){
                        ctx.moveTo(this.point[a].x , this.point[a].y);
                    }else{
                        ctx.lineTo(this.point[a].x , this.point[a].y);
                    }
                }
                ctx.lineTo(this.point[0].x , this.point[0].y)
                ctx.stroke();
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize',canvasResize);
    </script>
</body>
</html>
