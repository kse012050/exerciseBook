<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.8 마우스 움직임에 따라 별 생성</title>
    <style>
        body{line-height: 0; margin: 0;}
        #canvas{background-color: black;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let canvas , ctx , w , h , paticles = [];

        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            canvasSize();
            animationLoop();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function animationLoop(){
            paticles.push(new Paticle);
            paticles[0].setPoint();
            paticles[0].draw();

            requestAnimationFrame(animationLoop);
        }

        class Paticle{
            constructor(){
                this.x = w / 2;
                this.y = h / 2;
                this.point = []
                this.size = 0;
            }

            setPoint(){
                this.update();
                let x , y , r , d;
                this.point = [];
                for(let a = 0; a < 360; a += 36){
                    d = (a / 36) % 2 == 0 ? this.size / 2 : this.size;
                    r = (Math.PI / 180) * a;
                    x = this.x + d * Math.sin(r);
                    y = this.y + d * Math.cos(r);
                    this.point.push({
                        x : x,
                        y : y
                    })
                }
            }

            draw(){
                this.point.map((p)=>{
                    ctx.beginPath();
                    ctx.fillStyle = 'red'
                    ctx.arc(p.x, p.y , 3 , 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.beginPath();
                for(let a = 0; a < this.point.length; a++){
                    ctx.strokeStyle = 'blue';
                    (a === 0) ? ctx.moveTo(this.point[a].x ,this.point[a].y ) : ctx.lineTo(this.point[a].x , this.point[a].y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            update(){
                this.size += 0.5;
            }
        }

        window.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
