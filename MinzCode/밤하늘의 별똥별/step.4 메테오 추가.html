<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.4 메테오 추가</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background: linear-gradient(0deg , rgba(13,35,93,1) 0% , rgba(0,5,8,1) 70%);}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let canvas , ctx , w , h , moon , stars = [], meteors = [];
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            canvasSize();
            moon = new Moon();

            for(let a = 0; a < w * h * 0.0001; a++){
                stars.push(new Star())
            }

            for(let a = 0; a < 5; a++){
                meteors.push(new Meteor())
            }

            animationLoop();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function animationLoop(){
            ctx.clearRect(0,0,w,h);

            drawScene();

            requestAnimationFrame(animationLoop)
        }

        function drawScene(){
            moon.draw();

            stars.map((star)=>{
                star.draw();
                star.update();
            })

            meteors.map((meteor)=>{
                meteor.draw();
                meteor.update();
            })
        }

        class Moon{
            constructor(){
                this.x = 150;
                this.y = 150;
                this.size = 100;
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x , this.y , this.size , 0 , Math.PI * 2);
                ctx.fillStyle = 'rgba(254 , 247 , 144 , 1)'
                ctx.shadowColor = 'rgba(256 , 247 , 144 , 0.7)'
                ctx.shadowBlur = 70;
                ctx.fill();
            }
        }

        class Star{
            constructor(){
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() + 0.5;
                this.alpha = 1;
                this.alphaChange = 0;
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.size,0,Math.PI * 2)
                ctx.fillStyle = `rgba(255,255,255,${this.alpha})`
                ctx.fill();
            }
            update(){
                if(this.alphaChange === 0 && Math.random() < 0.01){
                    this.alphaChange = -1;
                }else if(this.alphaChange !== 0){
                    this.alpha += this.alphaChange * 0.05;
                    if(this.alpha <= 0){
                        this.alphaChange = 1;
                    }else if(this.alpha >= 1){
                        this.alphaChange = 0;
                    }
                }
            }
        }

        class Meteor{
            constructor(){
                this.reset();
            }
            reset(){
                this.x = Math.random() * w;
                this.y = -100;
                this.size = Math.random() * 2 + 2;
                this.speed = (6 - (this.size)) * 1.5;
            }
            draw(){
                ctx.beginPath()
                ctx.moveTo(this.x , this.y)
                ctx.lineWidth = this.size;
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'
                ctx.lineCap = "round"
                for(let a = 0; a < 10; a++){
                    ctx.lineTo(this.x + (this.size * a * 2) , this.y - (this.size * a * 2))
                    ctx.stroke();
                }
            }
            update(){
                this.x -= this.speed;
                this.y += this.speed;
                if(this.y > h + (this.y)){
                    this.reset();
                }
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize', canvasSize)
    </script>
</body>
</html>
