<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.3 별 갯수 및 반짝이는 효과</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background: linear-gradient(0deg , rgba(13,35,93,1) 0% , rgba(0,5,8,1) 70%);}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let canvas , ctx , w, h , moon, stars = [];
        function init(){
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            canvasSize();
            moon = new Moon();

            for(let a = 0; a < w * h * 0.0001; a++){
                stars.push(new Star());
            }
            animationLoop();
        }

        function canvasSize(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function animationLoop(){
            ctx.clearRect(0,0,w,h);

            drawScene();

            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            moon.draw();
            moon.update();

            stars.map((star)=>{
                star.draw();
                star.update();
            })
        }

        class Moon{
            constructor(){
                this.x = 150;
                this.y = 150;
                this.size = 100;
                this.shadowColor = [254,247,144]
                this.shadowAni = true;
            }
            
            draw(){
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.size,0,Math.PI * 2);
                ctx.fillStyle = 'rgba(254,247,144,1)';
                ctx.shadowColor = `rgba(${this.shadowColor[0]},${this.shadowColor[1]},${this.shadowColor[2]}, 0.7)`;
                ctx.shadowBlur = 70;
                ctx.fill();
            }

            update(){
                if(this.shadowAni){
                    this.shadowColor[0] < 255 && this.shadowColor[0]++;
                    this.shadowColor[1] < 255 && this.shadowColor[1]++;
                    this.shadowColor[2] < 255 && this.shadowColor[2]++;
                    this.shadowColor[2] >= 255 && (this.shadowAni = !this.shadowAni)
                }else{
                    this.shadowColor[0] > 254 && this.shadowColor[0]--;
                    this.shadowColor[1] > 247 && this.shadowColor[1]--;
                    this.shadowColor[2] > 144 && this.shadowColor[2]--;
                    this.shadowColor[2] <= 144 && (this.shadowAni = !this.shadowAni);
                }
            }
        }
        class Star{
            constructor(){
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() + 0.5;
                this.alpha = 1;
                this.blinkChance = 0.005;
                this.alphaChange = 0;
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x,this.y, this.size, 0 , Math.PI *2);
                ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
                ctx.fill();
            }
            update(){
                if(this.alphaChange === 0 &&  Math.random() < this.blinkChance ){
                    this.alphaChange = -1;
                }else if(this.alphaChange !== 0){
                    this.alpha += this.alphaChange * 0.05;
                    if(this.alpha <= 0){
                        this.alphaChange = 1;
                    }else if(this.alpha >= 1){
                        this.alphaChange = 0;
                    }
                }
                // if(this.alphaChange === 0 && Math.random() < this.blinkChance){
                //     this.alphaChange = -1;
                // }else if(this.alphaChange !== 0){
                //     this.alpha += this.alphaChange * 0.05;
                //     if(this.alpha <= 0){
                //         this.alphaChange = 1;
                //     }else if(this.alpha >= 1){
                //         this.alphaChange = 0;
                //     }
                // }
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize',canvasSize);
    </script>
</body>
</html>
