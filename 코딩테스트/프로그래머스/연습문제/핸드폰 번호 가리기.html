<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핸드폰 번호 가리기</title>
    <script>
        
        function SE(phone_number) {
            var answer = phone_number;
            var count = phone_number.length - 4;
            var answer2 = answer.substring(count);
            answer = '';
            for(var a = 0; a < count; a++){
                answer += '*'    
            }
            answer = answer + answer2;
            return answer;
        }
        console.log(
            SE('123456789')
        );

        function solution(phone_number) {
            return phone_number.replace(/\d(?=\d{4})/g, "*");
        }

        console.log(
            solution('123456789')
        );
    </script>
</head>

</body>
</html>
