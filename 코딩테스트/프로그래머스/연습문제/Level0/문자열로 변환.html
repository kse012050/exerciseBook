<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열로 변환</title>
    <script>
        function solution(n) {
            var answer = String(n);
            return answer;
        }
    </script>
</head>
<body>
    <h1>문자열로 변환</h1>
    <h2>문제 설명</h2>
    <p>정수 n이 주어질 때, n을 문자열로 변환하여 return하도록 solution 함수를 완성해주세요.</p>
    
    <h2>제한사항</h2>
    <ul>
        <li>1 ≤ n ≤ 10000</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>n</td>
            <td>result</td>
        </tr>
        <tr>
            <td>123</td>
            <td>"123"</td>
        </tr>
        <tr>
            <td>2573</td>
            <td>"2573"</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>123을 문자열로 변환한 "123"을 return합니다.</li>
    </ul>

    <strong>입출력 예 #2</strong>
    <ul>
        <li>2573을 문자열로 변환한 "2573"을 return합니다.</li>
    </ul>

</body>
</html>
