<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운트 다운</title>
  <script>
    function SE(start, end) {
      var answer = [];
      for(let a = start; a >= end; a--){
        answer.push(a)
      }
      return answer;
    }
    console.log(SE(10,3));
  </script>
</head>
<body>
  <h1>카운트 다운</h1>
  <h2>문제 설명</h2>
  <p>정수 start와 end가 주어질 때, start에서 end까지 1씩 감소하는 수들을 차례로 담은 리스트를 return하도록 solution 함수를 완성해주세요.</p>

  <h2>제한사항</h2>
  <ul>
    <li>0 ≤ end ≤ start ≤ 50</li>
  </ul>
  
  <h2>입출력 예</h2>
  <table>
    <tr>
      <td>start</td>
      <td>end</td>
      <td>result</td>
    </tr>
    <tr>
      <td>10</td>
      <td>3</td>
      <td>[10, 9, 8, 7, 6, 5, 4, 3]</td>
    </tr>
  </table>

  <h2>입출력 예 설명</h2>
  <strong>입출력 예 #1</strong>
  <ul>
    <li>10부터 3까지 1씩 감소하는 수를 담은 리스트는 [10, 9, 8, 7, 6, 5, 4, 3]입니다.</li>
  </ul>
  
</body>
</html>
