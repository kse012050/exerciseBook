<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자 리스트를 문자열로 변환하기</title>
    <script>
        function SE(arr) {
            var answer = arr.join('');
            return answer;
        }
        console.log(SE(["a","b","c"]));
    </script>
</head>
<body>
    <h1>문자 리스트를 문자열로 변환하기</h1>
    <h2>문제 설명</h2>
    <p>문자들이 담겨있는 배열 arr가 주어집니다. arr의 원소들을 순서대로 이어 붙인 문자열을 return 하는 solution함수를 작성해 주세요.</p>

    <h2>제한사항</h2>
    <ul>
        <li>1 ≤ arr의 길이 ≤ 200</li>
        <li>arr의 원소는 전부 알파벳 소문자로 이루어진 길이가 1인 문자열입니다.</li>
    </ul>

    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>arr</td>
            <td>result</td>
        </tr>
        <tr>
            <td>["a","b","c"]</td>
            <td>"abc"</td>
        </tr>
    </table>
</body>
</html>
