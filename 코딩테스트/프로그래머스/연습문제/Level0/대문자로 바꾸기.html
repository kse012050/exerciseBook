<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대문자로 바꾸기</title>
    <script>
        function SE(myString) {
            var answer = myString.toUpperCase();
            return answer;
        }
        console.log(SE("aBcDeFg"));
    </script>
</head>
<body>
    <h1>대문자로 바꾸기</h1>
    <h2>문제 설명</h2>
    <p>알파벳으로 이루어진 문자열 myString이 주어집니다. 모든 알파벳을 대문자로 변환하여 return 하는 solution 함수를 완성해 주세요.</p>

    <h2>제한사항</h2>
    <ul>
        <li>1 ≤ myString의 길이 ≤ 100,000</li>
        <li>myString은 알파벳으로 이루어진 문자열입니다.</li>
    </ul>

    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>myString</td>
            <td>result</td>
        </tr>
        <tr>
            <td>"aBcDeFg"</td>
            <td>"ABCDEFG"</td>
        </tr>
        <tr>
            <td>"AAA"</td>
            <td>"AAA"</td>
        </tr>
    </table>

</body>
</html>
