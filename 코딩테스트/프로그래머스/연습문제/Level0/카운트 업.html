<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운트 업</title>
    <script>
        function solution(start, end) {
            var answer = [];
            for(let a = start; a <= end; a++){
                answer.push(a)
            }
            return answer;
        }
    </script>
</head>
<body>
    <h1>카운트 업</h1>
    <h2>문제 설명</h2>
    <p>정수 start와 end가 주어질 때, start부터 end까지의 숫자를 차례로 담은 리스트를 return하도록 solution 함수를 완성해주세요.</p>
    
    <h2>제한사항</h2>
    <ul>
        <li>0 ≤ start ≤ end ≤ 50</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>start</td>
            <td>end</td>
            <td>result</td>
        </tr>
        <tr>
            <td>3</td>
            <td>10</td>
            <td>[3, 4, 5, 6, 7, 8, 9, 10]</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>3부터 10까지의 숫자들을 담은 리스트 [3, 4, 5, 6, 7, 8, 9, 10]를 return합니다.</li>
    </ul>
</body>
</html>
