<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나이 출력</title>
    <script>
        function SE(age) {
            var answer = 2023 - age;
            return answer;
        }
        console.log(SE(40));
    </script>
</head>
<body>
    <h1>나이 출력</h1>
    <h2>문제 설명</h2>
    <p>머쓱이는 40살인 선생님이 몇 년도에 태어났는지 궁금해졌습니다. 나이 age가 주어질 때, 2022년을 기준 출생 연도를 return 하는 solution 함수를 완성해주세요.</p>

    <h2>제한사항</h2>
    <ul>
        <li>0 < age ≤ 120</li>
        <li>나이는 태어난 연도에 1살이며 1년마다 1씩 증가합니다.</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>age</td>
            <td>result</td>
        </tr>
        <tr>
            <td>40</td>
            <td>1983</td>
        </tr>
        <tr>
            <td>23</td>
            <td>2000</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>2022년 기준 40살이므로 1983년생입니다.</li>
    </ul>
    <strong>입출력 예 #2</strong>
    <ul>
        <li>2022년 기준 23살이므로 2000년생입니다.</li>
    </ul>
</body>
</html>
