<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짝수의 합</title>
    <script>
        function SE(n) {
            var answer = Math.floor(n / 2);
            return answer * (answer + 1);
        }
    </script>
</head>
<body>
    <h1>짝수의 합</h1>
    <h2>문제 설명</h2>
    <p>정수 n이 주어질 때, n이하의 짝수를 모두 더한 값을 return 하도록 solution 함수를 작성해주세요.</p>
    
    <h2>제한사항</h2>
    <p>0 < n ≤ 1000</p>
    
    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>n</td>
            <td>result</td>
        </tr>
        <tr>
            <td>10</td>
            <td>30</td>
        </tr>
        <tr>
            <td>4</td>
            <td>6</td>
        </tr>
    </table>
    
    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>n이 10이므로 2 + 4 + 6 + 8 + 10 = 30을 return 합니다.</li>
    </ul>
    <strong>입출력 예 #2</strong>
    <ul>
        <li>n이 4이므로 2 + 4 = 6을 return 합니다.</li>
    </ul>
</body>
</html>
