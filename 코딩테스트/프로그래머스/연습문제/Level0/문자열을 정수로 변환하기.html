<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열을 정수로 변환하기</title>
    <script>
        function SE(n_str) {
            var answer = parseInt(n_str);
            return answer;
        }
        console.log(SE("8542"));
    </script>
</head>
<body>
    <h1>문자열을 정수로 변환하기</h1>
    <h2>문제 설명</h2>
    <p>숫자로만 이루어진 문자열 n_str이 주어질 때, n_str을 정수로 변환하여 return하도록 solution 함수를 완성해주세요.</p>

    <h2>제한사항</h2>
    <ul>
        <li>1 ≤ n_str ≤ 5</li>
        <li>n_str은 0부터 9까지의 정수 문자로만 이루어져 있습니다.</li>
    </ul>

    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>n_str</td>
            <td>result</td>
        </tr>
        <tr>
            <td>"10"</td>
            <td>10</td>
        </tr>
        <tr>
            <td>"8542"</td>
            <td>8542</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>"10"을 정수로 바꾸면 10입니다.</li>
    </ul>

    <strong>입출력 예 #2</strong>
    <ul>
        <li>"8542"를 정수로 바꾸면 8542입니다.</li>
    </ul>

</body>
</html>
