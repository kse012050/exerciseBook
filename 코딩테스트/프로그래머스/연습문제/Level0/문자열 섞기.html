<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 섞기</title>
    <script>
        function SE(str1, str2) {
            var answer = '';
            for(let a = 0; a < str1.length; a++) {
                answer += str1[a];
                answer += str2[a];
            }
            return answer;
        }
        console.log(SE("aaaaa", "bbbbb"));
        
        function case01(str1, str2) {
            return [...str1].map((x, idx)=> x+str2[idx]).join("");
        }
        console.log(case01("aaaaa", "bbbbb"));
    </script>
</head>
<body>
    <h1>문제 설명</h1>
    <p>길이가 같은 두 문자열 str1과 str2가 주어집니다.</p>
    <p>두 문자열의 각 문자가 앞에서부터 서로 번갈아가면서 한 번씩 등장하는 문자열을 만들어 return 하는 solution 함수를 완성해 주세요.</p>
    
    <h2>제한사항</h2>
    <ul>
        <li>1 ≤ str1의 길이 = str2의 길이 ≤ 10
            <ul>
                <li>str1과 str2는 알파벳 소문자로 이루어진 문자열입니다.</li>
            </ul>
        </li>
    </ul>
    
    
    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>str1</td>
            <td>str2</td>
            <td>result</td>
        </tr>
        <tr>
            <td>"aaaaa"</td>
            <td>"bbbbb"</td>
            <td>"ababababab"</td>
        </tr>
    </table>
</body>
</html>
