<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제곱수 판별하기</title>
    <script>
        function SE(n) {
            return Number.isInteger(Math.sqrt(n)) ? 1 : 2;
        }
        console.log(SE(144));
    </script>
</head>
<body>
    <h1>제곱수 판별하기</h1>
    <h2>문제 설명</h2>
    <p>어떤 자연수를 제곱했을 때 나오는 정수를 제곱수라고 합니다. 정수 n이 매개변수로 주어질 때, n이 제곱수라면 1을 아니라면 2를 return하도록 solution 함수를 완성해주세요.</p>
    
    <h2>제한사항</h2>
    <ul>
        <li>1 ≤ n ≤ 1,000,000</li>
    </ul>
    <h2>입출력 예</h2>
    <table>
        <tr>
            <td>n</td>
            <td>result</td>
        </tr>
        <tr>
            <td>144</td>
            <td>1</td>
        </tr>
        <tr>
            <td>976</td>
            <td>2</td>
        </tr>
    </table>
    
    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>144는 12의 제곱이므로 제곱수입니다. 따라서 1을 return합니다.</li>
    </ul>
    
    <strong>입출력 예 #2</strong>
    <ul>
        <li>976은 제곱수가 아닙니다. 따라서 2를 return합니다.</li>
    </ul>
</body>
</html>
