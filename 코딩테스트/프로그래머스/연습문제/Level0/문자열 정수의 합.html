<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 정수의 합</title>
    <script>
        function SE(num_str) {
            var answer = num_str.split('').reduce((prev , next)=> Number(prev) + Number(next));
            return answer;
        }
        console.log(SE("123456789"));
    </script>
</head>
<body>
    <h1>문자열 정수의 합</h1>
    <h2>문제 설명</h2>
    <p>한 자리 정수로 이루어진 문자열 num_str이 주어질 때, 각 자리수의 합을 return하도록 solution 함수를 완성해주세요.</p>
    
    <h2>제한사항</h2>
    <ul>
        <li>3 ≤ num_str ≤ 100</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table>
        <tr>
            <td>num_str</td>
            <td>result</td>
        </tr>
        <tr>
            <td>"123456789"</td>
            <td>45</td>
        </tr>
        <tr>
            <td>"1000000"</td>
            <td>1</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>문자열 안의 모든 숫자를 더하면 45가 됩니다.</li>
    </ul>
    
    <strong>입출력 예 #2</strong>
    <ul>
        <li>문자열 안의 모든 숫자를 더하면 1이 됩니다.</li>
    </ul>
    
</body>
</html>
