<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정수 부분</title>
    <script>
        function SE(flo) {
            var answer = Math.floor(flo);
            return answer;
        }
        console.log(SE(1.42));
    </script>
</head>
<body>
    <h1>정수 부분</h1>
    <h2>문제 설명</h2>
    <p>실수 flo가 매개 변수로 주어질 때, flo의 정수 부분을 return하도록 solution 함수를 완성해주세요.<h2></h2></p>
    <h2>제한사항</h2>
    <ul>
        <li>0 ≤ flo ≤ 100</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table border="1">
        <tr>
            <td>flo</td>
            <td>result</td>
        </tr>
        <tr>
            <td>1.42</td>
            <td>1</td>
        </tr>
        <tr>
            <td>69.32</td>
            <td>69</td>
        </tr>
    </table>
    
    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <ul>
        <li>1.42의 정수 부분은 1입니다.</li>
    </ul>
    <strong>입출력 예 #2</strong>
    <ul>
        <li>69.32의 정수 부분은 69입니다.</li>
    </ul>
</body>
</html>
