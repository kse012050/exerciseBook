<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두 정수 사이의 합</title>
    <script>
        function SE(a, b) {
            var answer = 0;
            for(var i = Math.min(a, b); i <= Math.max(a, b); i++){
                answer += i;
            }
            return answer;
        }

        function case01(a , b){
            var result = 0
            return (a+b)*(Math.abs(b-a)+1)/2;
        }
        console.log(case01(-100 , -10));
    </script>
</head>
<body>
    <h1>두 정수 사이의 합</h1>

    <h2>문제 설명</h2>
    <p>두 정수 a, b가 주어졌을 때 a와 b 사이에 속한 모든 정수의 합을 리턴하는 함수, solution을 완성하세요.</p>
    <p>예를 들어 a = 3, b = 5인 경우, 3 + 4 + 5 = 12이므로 12를 리턴합니다.</p>

    <h2>제한 조건</h2>
    <ul>
        <li>a와 b가 같은 경우는 둘 중 아무 수나 리턴하세요.</li>
        <li>a와 b는 -10,000,000 이상 10,000,000 이하인 정수입니다.</li>
        <li>a와 b의 대소관계는 정해져있지 않습니다.</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table>
        <tr>
            <th>a</th>
            <th>b</th>
            <th>return</th>
        </tr>
        <tr>
            <td>3</td>
            <td>5</td>
            <td>12</td>
        </tr>
        <tr>
            <td>3</td>
            <td>3</td>
            <td>3</td>
        </tr>
        <tr>
            <td>5</td>
            <td>3</td>
            <td>12</td>
        </tr>
    </table>
</body>
</html>
