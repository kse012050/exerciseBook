<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 내림차순으로 배치하기</title>
    <script>
        function SE(s) {
            var answer = s.split('');
            var array = []
            answer.map((c)=> {
                array.push(-c.charCodeAt())
            });
            // array.sort();
            array.sort((a, b) => a - b);
            answer = []
            array.map((c)=>{
                answer.push(String.fromCharCode(-c));
            })
            return answer.join('');
        }
        console.log(SE("ZAbcdefg"));

        
        function case01(s) {
            return s
                .split("")
                .sort()
                .reverse()
                .join("");
        }
        console.log(case01("ZAbcdefg"));
    </script>
</head>
<body>
    <h1>문자열 내림차순으로 배치하기</h1>

    <h2>문제 설명</h2>
    <p>문자열 s에 나타나는 문자를 큰것부터 작은 순으로 정렬해 새로운 문자열을 리턴하는 함수, solution을 완성해주세요.</p>
    <p>s는 영문 대소문자로만 구성되어 있으며, 대문자는 소문자보다 작은 것으로 간주합니다.</p>

    <h2>제한 사항</h2>
    <ul>
        <li>str은 길이 1 이상인 문자열입니다.</li>
    </ul>

    <h2>입출력 예</h2>
    <table>
        <tr>
            <th>s</th>
            <th>return</th>
        </tr>
        <tr>
            <td>"Zbcdefg"</td>
            <td>"gfedcbZ"</td> 
        </tr>
    </table>
</body>
</html>
