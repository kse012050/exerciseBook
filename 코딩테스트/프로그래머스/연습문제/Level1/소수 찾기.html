<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소수 찾기</title>
    <script>
        function solution(n) {
            var answer = [];
            var array = [];
            answer.push(2);
            for(var a = 0; a <= 10; a++){
                array.push(a);
            }
            for(var a = 3; a <= n; a++){
                if(array[a] == 0){
                    continue;
                }
                for(var b = 0; b < answer.length; b++){
                    if(b == (answer.length -1)){
                        answer.push(a);
                        break;
                    }else if(a % answer[b] == 0){
                        array[b] = 0;
                        break;
                    }
                }
            }
           return answer.length;
        }
        // console.log(solution(10));
        
        function case01(n) {
            let answer = 0;
            const arr = new Array(n+1).fill(true);
            console.log(arr);
            
            for(let i = 2; i <= n; ++i){
                // 이미 소수가 아닌 인덱스는 건너뛴다.
                if(arr[i] === false){
                    continue; 
                }
                // 배수는 소수가 아니라 0으로 설정
                for(let k = i * 2; k <= n; k += i){
                    arr[k] = false;
                }
            }
            // 소수의 갯수를 구한다.
            for(let i = 2; i <= n; ++i){
                if(arr[i] === true){
                    answer++;
                }
            }
            return answer;
        }
        console.log(case01(10));
    </script>
</head>
<body>
    <h1>소수 찾기</h1>

    <h2>문제 설명</h2>
    <p>1부터 입력받은 숫자 n 사이에 있는 소수의 개수를 반환하는 함수, solution을 만들어 보세요.</p>

    <p>
        소수는 1과 자기 자신으로만 나누어지는 수를 의미합니다.<br/>
        (1은 소수가 아닙니다.)
    </p>

    <h2>제한 조건</h2>
    <ul>
        <li>n은 2이상 1000000이하의 자연수입니다.</li>
    </ul>
    
    <h2>입출력 예</h2>
    <table>
        <tr>
            <th>n</th>
            <th>result</th>
        </tr>
        <tr>
            <td>10</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>3</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>

    <strong>입출력 예 #1</strong>
    <p>1부터 10 사이의 소수는 [2,3,5,7] 4개가 존재하므로 4를 반환</p>

    <strong>입출력 예 #2</strong>
    <p>1부터 5 사이의 소수는 [2,3,5] 3개가 존재하므로 3를 반환</p>
</body>
</html>
