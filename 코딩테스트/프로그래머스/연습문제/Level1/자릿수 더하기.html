<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자릿수 더하기</title>
    <script>
        function SE(n){
            var answer = 0;
            (n + '').split('').map((num)=>answer += parseFloat(num));
            return answer;
        }

        console.log(SE(123));

        function case01(n){
            return (n+"").split("").reduce((acc, curr) => acc + parseInt(curr), 0)
        }
        console.log(case01(123));
    </script>
</head>
<body>
    <h1>자릿수 더하기</h1>
    <h2>문제 설명</h2>
    <p>자연수 N이 주어지면, N의 각 자릿수의 합을 구해서 return 하는 solution 함수를 만들어 주세요.</p>
    <p>예를들어 N = 123이면 1 + 2 + 3 = 6을 return 하면 됩니다.</p>

    <h2>제한사항</h2>
    <ul>
        <li>N의 범위 : 100,000,000 이하의 자연수</li>
    </ul>

    <h2>입출력 예</h2>
    <table>
        <tr>
            <th>N</th>
            <th>answer</th>
        </tr>
        <tr>
            <td>123</td>
            <td>6</td>
        </tr>
        <tr>
            <td>987</td>
            <td>24</td>
        </tr>
    </table>

    <h2>입출력 예 설명</h2>
    <strong>입출력 예 #1</strong>
    <p>문제의 예시와 같습니다.</p>

    <strong>입출력 예 #2</strong>
    <p>9 + 8 + 7 = 24이므로 24를 return 하면 됩니다.</p>
</body>
</html>
