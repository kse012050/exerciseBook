<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 다루기 기본</title>
    <script>
        function solution(s) {
            var answer = Number(s);
            console.log(isNaN(answer));
            return !isNaN(answer);
        }
        console.log(solution("123"));
    </script>
</head>
<body>
    <h1>문자열 다루기 기본</h1>
    <h2>문제 설명</h2>
    <p>문자열 s의 길이가 4 혹은 6이고, 숫자로만 구성돼있는지 확인해주는 함수, solution을 완성하세요. 예를 들어 s가 "a234"이면 False를 리턴하고 "1234"라면 True를 리턴하면 됩니다.</p>

    <h2>제한 사항</h2>
    <ul>
        <li>s는 길이 1 이상, 길이 8 이하인 문자열입니다.</li>
    </ul>

    <h2>입출력 예</h2>
    <table>
        <tr>
            <th>s</th>
            <th>return</th>
        </tr>
        <tr>
            <td>"a234"</td>
            <td>false</td>
        </tr>
        <tr>
            <td>"1234"</td>
            <td>true</td>
        </tr>
    </table>
</body>
</html>
