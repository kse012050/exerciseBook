<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연수 뒤집어 배열로 만들기</title>
    <script>
        function SE(n) {
            var answer = (n + '').split('').reverse();
            for(var a = 0; a < answer.length; a++){
                answer[a] = parseFloat(answer[a])
            }
            return answer;
        }
        console.log(SE(12345));
    </script>
</head>
<body>
    <h1>자연수 뒤집어 배열로 만들기</h1>

    <h2>문제 설명</h2>
    <p>자연수 n을 뒤집어 각 자리 숫자를 원소로 가지는 배열 형태로 리턴해주세요. 예를들어 n이 12345이면 [5,4,3,2,1]을 리턴합니다.</p>

    <h2>제한 조건</h2>
    <ul>
        <li>n은 10,000,000,000이하인 자연수입니다.</li>
    </ul>

    <h2>입출력 예</h2>
    <table>
        <tr>
            <th>n</th>
            <th>return</th>
        </tr>
        <tr>
            <td>12345</td>
            <td>[5,4,3,2,1]</td>
        </tr>
    </table>
</body>
</html>
