<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열을 정수로 바꾸기</title>
    <script>
        function solution(s) {
            return parseInt(s);
        }
        console.log(solution('-1234'));
    </script>
</head>
<body>
    <h1>문자열을 정수로 바꾸기</h1>
    <h2>문제 설명</h2>
    <p>문자열 s를 숫자로 변환한 결과를 반환하는 함수, solution을 완성하세요.</p>

    <h2>제한 조건</h2>
    <ul>
        <li>s의 길이는 1 이상 5이하입니다.</li>
        <li>s의 맨앞에는 부호(+, -)가 올 수 있습니다.</li>
        <li>s는 부호와 숫자로만 이루어져있습니다.</li>
        <li>s는 "0"으로 시작하지 않습니다.</li>
    </ul>
    
    <h2>입출력 예</h2>
    <p>예를들어 str이 "1234"이면 1234를 반환하고, "-1234"이면 -1234를 반환하면 됩니다.</p>
    <p>str은 부호(+,-)와 숫자로만 구성되어 있고, 잘못된 값이 입력되는 경우는 없습니다.</p>
</body>
</html>
