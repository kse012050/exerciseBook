    function init() {

    function getQuadValue(p0,p1,p2,t){
      return (1 -t) * (1 - t) * p0 + 2 * (1 - t) * t * p1 + t * t * p2;
    }
    function getPointOnQuad(x1,y1,x2,y2,x3,y3,t){
      return {
        x : this.getQuadValue(x1,x2,x3,t),
        y : this.getQuadValue(y1,y2,y3,t),
      }
    }
