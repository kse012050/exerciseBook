<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 - Solid Color (Three.js)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";

    const canvas = document.querySelector("#canvas");

    // WebGLRenderer가 WebGL 컨텍스트 생성과 화면 출력을 맡는다.
    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      powerPreference: "high-performance"
    });

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();

    // 화면 전체를 덮는 사각형을 두 개의 삼각형으로 만든다.
    const positions = new Float32Array([
      -1, -1, 0,
       1, -1, 0,
      -1,  1, 0,
      -1,  1, 0,
       1, -1, 0,
       1,  1, 0
    ]);

    // BufferGeometry가 createBuffer, bindBuffer, bufferData 작업을 대신한다.
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

    const VS = `
      attribute vec3 position;

      void main() {
        gl_Position = vec4(position, 1.0);
      }
    `;

    const FS = `
      precision highp float;

      void main() {
        gl_FragColor = vec4(0.05, 0.55, 0.95, 1.0);
      }
    `;

    // RawShaderMaterial이 셰이더 컴파일과 프로그램 연결을 대신한다.
    const material = new THREE.RawShaderMaterial({
      vertexShader: VS,
      fragmentShader: FS,
      depthTest: false,
      depthWrite: false
    });

    const rectangle = new THREE.Mesh(geometry, material);
    rectangle.frustumCulled = false;
    scene.add(rectangle);

    function draw() {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);

      // WebGL의 drawArrays 대신 Three.js의 render를 호출한다.
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", draw);
    draw();
  </script>
</body>
</html>
