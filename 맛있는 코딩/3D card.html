<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D card</title>
    <style>
        html, body{height: 100%; display: flex; justify-content: center; align-items: center;}
        #card{width: 300px; height: 450px; background: url('./background.jpg') no-repeat center / cover; border-radius: 10px; transition: 200ms scale; position: relative; transform: rotate3d(0,0,0,20deg);}
        #card:hover{scale: 1.05;}
        #light{position: absolute; width: 100%; height: 100%;}
    </style>
</head>
<body>
    <div id="card">
        <div id="light"></div>
    </div>

    <script>
        const card = document.getElementById('card');
        const light = document.getElementById('light');
        
        console.log(card.getBoundingClientRect());
        const {x, y, width, height} = card.getBoundingClientRect();

        function mouseMove(e){
            const mouseX = e.offsetX - (width / 2);
            const mouseY = (height / 2) - e.offsetY;
            const d = Math.sqrt(e.offsetX**2 + e.offsetY**2);
            
            const left = e.clientX - x;
            const top = e.clientY - y;
            const centerX = left - width / 2;
            const centerY = top - height / 2;
            // const d = Math.sqrt(centerX**2 + centerY**2);
            // console.log(e.offsetX);
            console.log('centerX', centerX);
            console.log('mouseX', mouseX);
            console.log(centerX === mouseX);
            // console.log(d);
            // card.style.transform = `rotate3d(${-mouseY / 100}, ${mouseX / 100}, 0, ${d / 8}deg)`
            card.style.transform = `
                rotate3d(
                    ${-centerY / 100}, ${centerX / 100}, 0, ${d / 8}deg
                )
            `
        }

        card.addEventListener('mousemove', mouseMove)
    </script>
</body>
</html>
